<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400">
  <defs>
    <!-- Fondo suave general con calidez champagne muy sutil -->
    <linearGradient id="bgGoldCanvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCFAF5" />
    </linearGradient>

    <!-- Gradientes Oro Brillante Pulido para la letra R (Oro Amarillo Intenso / Oro Puro Reflejado) -->
    <linearGradient id="goldRFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FACC15" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="goldRSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A16207" />
      <stop offset="50%" stop-color="#854D0E" />
      <stop offset="100%" stop-color="#583101" />
    </linearGradient>
    <linearGradient id="goldRTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Gradientes Oro Bronce / Oro Champaña para la letra M (Profundidad metálica y contraste noble) -->
    <linearGradient id="goldMFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D4A8" />
      <stop offset="40%" stop-color="#C5A85C" />
      <stop offset="80%" stop-color="#9A7B38" />
      <stop offset="100%" stop-color="#785E22" />
    </linearGradient>
    <linearGradient id="goldMSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5218" />
      <stop offset="100%" stop-color="#3B2A08" />
    </linearGradient>
    <linearGradient id="goldMTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F3E8C4" />
      <stop offset="50%" stop-color="#E2D4A8" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Gradiente de acento para divisores y badges dorados -->
    <linearGradient id="goldAccentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Sombras tridimensionales cálidas y elegantes -->
    <filter id="drop3dGold" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="6" dy="14" stdDeviation="12" flood-color="#583101" flood-opacity="0.16" />
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#854D0E" flood-opacity="0.12" />
    </filter>

    <!-- Pedestal flotante con reflejos dorados sutiles -->
    <linearGradient id="pedestalBgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBF8EE" />
    </linearGradient>
  </defs>

  <!-- FONDO GENERAL CON MARGEN SEGURO -->
  <rect x="0" y="0" width="860" height="400" rx="20" fill="url(#bgGoldCanvasGrad)" stroke="#E9DFC7" stroke-width="1.5" />

  <!-- GRUPO PRINCIPAL 3D: ISOTIPO ISOMÉTRICO RM CON TRAZOS BOLD EN ORO BRILLANTE -->
  <g transform="translate(45, 45)">
    <!-- Base pedestal flotante Gold Edition -->
    <rect x="15" y="15" width="280" height="280" rx="56" fill="url(#pedestalBgGold)" filter="url(#drop3dGold)" stroke="#E9DFC7" stroke-width="1.8" />

    <!-- Rejilla virtual sutil en tono oro mate de soporte geométrico -->
    <g opacity="0.5" stroke="#E2D4A8" stroke-width="1.2">
      <line x1="40" y1="244" x2="270" y2="244" />
      <line x1="68" y1="260" x2="242" y2="260" />
    </g>

    <!-- MONOGRAMA 3D RM GOLD EDITION BOLD (Misma escala e idénticos parámetros) -->
    <g transform="translate(40, 44) scale(1.30)">
      <!-- Sombra de suelo de las letras en tonos castaño/ámbar oscuro -->
      <path d="M 18 155 C 52 168 152 168 182 150 C 158 140 52 140 18 155 Z" fill="#382104" opacity="0.22" filter="blur(5px)" />

      <!-- LETRA 'M' (3D Detrás: Oro Bronce / Champaña Metálico Bold) -->
      <g id="gold-M-3D">
        <!-- Caras 3D superiores y laterales adaptadas al gran calibre -->
        <polygon points="76,144 92,152 92,68 76,58" fill="url(#goldMSide)" />
        <polygon points="92,152 118,152 102,144 76,144" fill="#2E1D03" />
        <polygon points="106,58 122,68 135,108 123,98" fill="url(#goldMSide)" />
        <polygon points="135,108 149,116 161,78 149,68" fill="#3D2906" />
        <polygon points="149,68 165,78 165,152 149,144" fill="url(#goldMSide)" />
        <polygon points="149,68 165,78 190,78 174,68" fill="url(#goldMTop)" />
        <polygon points="174,68 190,78 190,152 174,144" fill="#2E1D03" />
        <!-- Tapa superior bisel frontal de la M -->
        <polygon points="76,58 92,68 106,68 106,58" fill="url(#goldMTop)" />

        <!-- Frontal de la M en Oro Bronce / Oro Satinado -->
        <path d="M 76 144 L 76 58 L 106 58 L 126 102 L 146 58 L 174 58 L 174 144 L 148 144 L 148 95 L 133 124 L 119 124 L 104 95 L 104 144 Z" 
              fill="url(#goldMFront)" stroke="#F3E8C4" stroke-width="1.4" stroke-linejoin="round" />
        <polyline points="77,143 77,59 105,59 125,102" stroke="#FFFBEB" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
        <polyline points="147,59 173,59 173,143" stroke="#FFFBEB" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
      </g>

      <!-- LETRA 'R' (3D Frente: Oro Amarillo Brillante Pulido con reflejos especulares de luz viva) -->
      <g id="gold-R-3D">
        <!-- Oclusión de sombra cálida proyectada por la R sobre la M -->
        <path d="M 74 50 L 104 80 L 104 146 L 78 136 Z" fill="#281701" opacity="0.36" filter="blur(2.2px)" />
        
        <!-- Caras 3D laterales y superiores de la R -->
        <polygon points="42,42 56,52 56,150 42,140" fill="url(#goldRSide)" />
        <polygon points="16,42 30,32 56,32 42,42" fill="url(#goldRTop)" />
        <polygon points="42,42 56,32 82,32 70,42" fill="url(#goldRTop)" />
        
        <!-- Curvatura lateral 3D de la cabeza de la R en oro profundo -->
        <path d="M 70 42 C 92 42 106 54 106 72 C 106 87 92 98 70 98 L 82 108 C 112 108 122 89 122 72 C 122 49 100 32 82 32 Z" fill="url(#goldRSide)" />
        
        <!-- Pata diagonal 3D engrosada -->
        <polygon points="50,96 64,106 96,150 82,140" fill="url(#goldRSide)" />
        <polygon points="82,140 96,150 114,150 100,140" fill="#382104" />

        <!-- Cara Frontal de la R con trazo Ultra Bold en degradado de Oro Amarillo Reluciente -->
        <path d="M 16 42 L 70 42 C 90 42 104 54 104 72 C 104 87 90 98 70 98 L 48 98 L 78 142 L 48 142 L 20 98 L 40 98 L 40 42 Z 
                 M 40 58 L 40 82 L 66 82 C 76 82 82 78 82 70 C 82 62 76 58 66 58 Z"
              fill="url(#goldRFront)" stroke="#FEF08A" stroke-width="1.6" stroke-linejoin="round" />
              
        <!-- Reflejos de luz especular viva / brillo diamante en los bordes de la R -->
        <path d="M 17 43 L 70 43 C 88 43 102 54 102 71" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95" />
        <line x1="17" y1="43" x2="17" y2="98" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.95" />
        <line x1="48" y1="141" x2="78" y2="141" stroke="#FEF9C3" stroke-width="1.8" opacity="0.9" />
        <!-- Destellos de luz brillante -->
        <circle cx="21" cy="45" r="3.8" fill="#FFFFFF" opacity="0.99" filter="blur(0.3px)" />
        <circle cx="72" cy="44" r="2.5" fill="#FFFFFF" opacity="0.9" />
      </g>
    </g>

    <!-- PASTILLA RICHI MATH DEBAJO DEL MONOGRAMA R M -->
    <g transform="translate(155, 270)">
      <rect x="-72" y="-13" width="144" height="26" rx="13" fill="#854D0E" opacity="0.09" stroke="#CA8A04" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="900" fill="#713F12" letter-spacing="2.5">RICHI MATH</text>
    </g>
  </g>

  <!-- BLOQUE TIPOGRÁFICO DE MARCA COMPLETO CON ACABADO DORADO PRESTIGIO -->
  <g transform="translate(375, 90)">
    <!-- Badge / Tag Gold Edition -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="156" height="26" rx="7" fill="#FEFCE8" stroke="#FDE047" stroke-width="1.2" />
      <circle cx="14" cy="13" r="4.5" fill="#EAB308" />
      <text x="26" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#854D0E" letter-spacing="1.2">GOLD EDITION</text>
    </g>

    <!-- Título Principal: RM y RICHI MATH (Heavy / Bold) -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="900" fill="#1C1917" letter-spacing="-1.5">RM</text>
      <!-- RICHI MATH debajo de las letras RM en tono Oro Cálido Intenso -->
      <g transform="translate(2, 38)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="900" fill="#A16207" letter-spacing="1.5">RICHI MATH</text>
      </g>
    </g>

    <!-- Subtítulo institucional con espaciado balanceado -->
    <g transform="translate(2, 154)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#44403C" letter-spacing="3">ESCUELA VIRTUAL DE MATEMÁTICAS</text>
    </g>

    <!-- Barra divisora en degradado de Oro Brillante y compatibilidad LMS -->
    <g transform="translate(2, 172)">
      <rect x="0" y="2" width="75" height="4" rx="2" fill="#CA8A04" opacity="0.2" />
      <rect x="0" y="0" width="75" height="4" rx="2" fill="url(#goldAccentBar)" />
      <circle cx="88" cy="2" r="2.5" fill="#EAB308" />
      <text x="100" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#78716C" letter-spacing="1">COMPATIBLE CON MOODLE · BOOST THEME</text>
    </g>
  </g>
</svg>
