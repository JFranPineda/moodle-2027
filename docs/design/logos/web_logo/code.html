<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340">
  <defs>
    <!-- Gradientes Oro Metálico Brillante / Amarillo Oro Imperial para la letra R frontal -->
    <linearGradient id="goldRFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="20%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldRSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="goldRTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Gradientes Oro Bronce Satinado Profundo / Oro Viejo para la letra M posterior -->
    <linearGradient id="goldMFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="goldMSide" x1="0%" y1="100%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="60%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#1E0B02" />
    </linearGradient>
    <linearGradient id="goldMTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <!-- Sombra suave volumétrica para suelo de las letras -->
    <filter id="softGlowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- FONDO TRANSPARENTE: Sin recuadros ni cajas sólidas -->

  <!-- GRUPO CENTRADO DEL MONOGRAMA 3D RM EN ACABADO DORADO -->
  <g transform="translate(45, 25) scale(1.65)" filter="url(#softGlowGold)">
    <!-- Sombra proyectada en la base en transparencia suave -->
    <path d="M 18 155 C 52 168 152 168 182 150 C 158 140 52 140 18 155 Z" fill="#2B1502" opacity="0.32" />

    <!-- LETRA 'M' (3D Detrás: Oro Bronce Satinado y Profundo) -->
    <g id="gold-M-3D">
      <polygon points="76,144 92,152 92,68 76,58" fill="url(#goldMSide)" />
      <polygon points="92,152 118,152 102,144 76,144" fill="#3B1804" />
      <polygon points="106,58 122,68 135,108 123,98" fill="url(#goldMSide)" />
      <polygon points="135,108 149,116 161,78 149,68" fill="#2E1203" />
      <polygon points="149,68 165,78 165,152 149,144" fill="url(#goldMSide)" />
      <polygon points="149,68 165,78 190,78 174,68" fill="url(#goldMTop)" />
      <polygon points="174,68 190,78 190,152 174,144" fill="#3B1804" />
      <polygon points="76,58 92,68 106,68 106,58" fill="url(#goldMTop)" />

      <!-- Frontal de la M -->
      <path d="M 76 144 L 76 58 L 106 58 L 126 102 L 146 58 L 174 58 L 174 144 L 148 144 L 148 95 L 133 124 L 119 124 L 104 95 L 104 144 Z" 
            fill="url(#goldMFront)" stroke="#F59E0B" stroke-width="1.3" stroke-linejoin="round" />
      <polyline points="77,143 77,59 105,59 125,102" stroke="#FDE68A" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      <polyline points="147,59 173,59 173,143" stroke="#FDE68A" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- LETRA 'R' (3D Frente: Oro Amarillo Pulido Brillante) -->
    <g id="gold-R-3D">
      <!-- Oclusión de sombra proyectada por la R sobre la M -->
      <path d="M 74 50 L 104 80 L 104 146 L 78 136 Z" fill="#1C0B02" opacity="0.55" />
      
      <!-- Caras 3D laterales y superiores de la R -->
      <polygon points="42,42 56,52 56,150 42,140" fill="url(#goldRSide)" />
      <polygon points="16,42 30,32 56,32 42,42" fill="url(#goldRTop)" />
      <polygon points="42,42 56,32 82,32 70,42" fill="url(#goldRTop)" />
      
      <!-- Curvatura lateral 3D -->
      <path d="M 70 42 C 92 42 106 54 106 72 C 106 87 92 98 70 98 L 82 108 C 112 108 122 89 122 72 C 122 49 100 32 82 32 Z" fill="url(#goldRSide)" />
      
      <!-- Pata diagonal 3D -->
      <polygon points="50,96 64,106 96,150 82,140" fill="url(#goldRSide)" />
      <polygon points="82,140 96,150 114,150 100,140" fill="#451A03" />

      <!-- Cara Frontal de la R con trazo Ultra Bold en oro vibrante -->
      <path d="M 16 42 L 70 42 C 90 42 104 54 104 72 C 104 87 90 98 70 98 L 48 98 L 78 142 L 48 142 L 20 98 L 40 98 L 40 42 Z 
               M 40 58 L 40 82 L 66 82 C 76 82 82 78 82 70 C 82 62 76 58 66 58 Z"
            fill="url(#goldRFront)" stroke="#FDE68A" stroke-width="1.5" stroke-linejoin="round" />
            
      <!-- Reflejos y biseles de luz especular blanca/oro claro -->
      <path d="M 17 43 L 70 43 C 88 43 102 54 102 71" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95" />
      <line x1="17" y1="43" x2="17" y2="98" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.95" />
      <line x1="48" y1="141" x2="78" y2="141" stroke="#FEF9C3" stroke-width="1.8" opacity="0.9" />
      <circle cx="21" cy="45" r="3.8" fill="#FFFFFF" opacity="0.99" />
      <circle cx="72" cy="44" r="2.5" fill="#FFFFFF" opacity="0.95" />
    </g>
  </g>
</svg>
