# /etc/bigbluebutton/bbb-web.properties — overrides de Richi Math.
#
# Solo lo que se aparta del valor por defecto de BBB. Los ficheros que genera
# BBB se pisan en cada actualización; este de override no.
# Referencia: https://docs.bigbluebutton.org/administration/customize/
# Aplicar con: bbb-conf --restart

# Sin límite de duración: las clases no se cortan a los 60 minutos.
defaultMeetingDuration=0

# El profesor pulsa Grabar cuando empieza. No arranca sola: así no se graba el
# cuarto de hora previo a la clase.
autoStartRecording=false
allowStartStopRecording=true

# Tope por sala. Se esperan 11; 20 deja sitio a algún invitado sin permitir que
# una sala se llene sola y tumbe el dimensionamiento del VPS.
defaultMaxUsers=20

# Todos entran en silencio: con 10 alumnos evita el ruido de fondo del inicio.
muteOnStart=true

# LA LÍNEA QUE SOSTIENE EL DIMENSIONAMIENTO: los alumnos no pueden encender
# cámara. Los bloqueos de BBB se aplican solo a los espectadores, así que el
# profesor conserva la suya.
lockSettingsDisableCam=true

# Red de seguridad por si alguien desbloquea la cámara en una sala concreta.
meetingCameraCap=2
