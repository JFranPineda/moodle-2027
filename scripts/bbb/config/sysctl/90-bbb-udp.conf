# BigBlueButton: bigger UDP buffers, so the kernel stops dropping the audio packets
# FreeSWITCH and mediasoup cannot read in time during a burst (UdpRcvbufErrors).
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.netdev_max_backlog = 5000
