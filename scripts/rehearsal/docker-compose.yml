# Phase 2 rehearsal: a production copy upgraded 4.3 → 4.5 → 5.3 on :8084.
# Driven by rehearse-upgrade.sh, which sets every variable below per hop.
# Its own compose project (rmrehearsal) and volumes: the 5.3 dev site on :8083
# is never touched.
services:
  db:
    image: ${DB_IMAGE}
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - db_data:/var/lib/mysql

  web:
    image: ${PHP_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APACHE_DOCUMENT_ROOT: ${DOCROOT}
    # Same router setup as the dev site (../../docker-compose.yml), on 8084.
    command: >
      bash -c "a2enmod rewrite >/dev/null 2>&1;
               grep -q 'Listen 8084' /etc/apache2/ports.conf || echo 'Listen 8084' >> /etc/apache2/ports.conf;
               sed -i 's/:80>/:80 *:8084>/' /etc/apache2/sites-enabled/000-default.conf;
               printf '<Directory ${DOCROOT}>\n    AllowOverride FileInfo Indexes\n    RewriteEngine On\n    RewriteCond %%{REQUEST_FILENAME} !-f\n    RewriteCond %%{REQUEST_FILENAME} !-d\n    RewriteRule ^ /r.php [L]\n</Directory>\n' > /etc/apache2/conf-enabled/richimath-routes.conf;
               exec apache2-foreground"
    ports:
      - "8084:80"
    volumes:
      - ${CODE}:/var/www/html
      # The 5.3 tree already has the dev config.php: mount the rehearsal one over it.
      - ${CONFIG}:/var/www/html/config.php:ro
      - moodledata:/var/moodledata

volumes:
  db_data:
  moodledata:
